---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: create-test-result-attestation
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.56.0"
    tekton.dev/tags: "attestation, in-toto, conforma"
spec:
  description: >-
    Creates and pushes an unsigned in-toto test-result attestation to a
    container registry using oras. The attestation is attached as an OCI
    referrer and is discoverable via the referrers API. Trust is established
    by the SLSA provenance that Tekton Chains creates for the attestation
    via the ARTIFACT_OUTPUTS result.
  params:
    - name: image-url
      type: string
      description: Image URL without digest (e.g. quay.io/org/image)
    - name: image-digest
      type: string
      description: Image digest (sha256:...)
    - name: test-name
      type: string
      description: Name of the test (e.g. integration-test, clair-scan)
    - name: test-output
      type: string
      description: JSON test results to include in the attestation predicate
    - name: predicate-type
      type: string
      description: In-toto predicate type URI
      default: "https://in-toto.io/attestation/test-result/v0.1"
    - name: registry-config
      type: string
      description: >-
        Path to a docker config JSON file with push credentials. When set,
        oras uses this instead of the default merged credentials. Needed
        when multiple SA secrets conflict during Tekton credential merging.
      default: ""
  results:
    - name: TEST_OUTPUT_ARTIFACT_OUTPUTS
      description: >-
        JSON object with "uri" and "digest" fields referencing the pushed
        attestation. Tekton Chains uses this to include the attestation in
        SLSA provenance.
  image: quay.io/sbaird/attest-test-result:0.1
  env:
    - name: IMAGE_URL
      value: $(params.image-url)
    - name: IMAGE_DIGEST
      value: $(params.image-digest)
    - name: TEST_NAME
      value: $(params.test-name)
    - name: TEST_OUTPUT
      value: $(params.test-output)
    - name: PREDICATE_TYPE
      value: $(params.predicate-type)
    - name: REGISTRY_CONFIG
      value: $(params.registry-config)
  script: |
    #!/usr/bin/env bash
    set -euo pipefail

    RESULT_FILE="$(step.results.TEST_OUTPUT_ARTIFACT_OUTPUTS.path)"

    # Write empty results on any error
    write_empty_results() {
      echo -n '{"uri":"","digest":""}' > "${RESULT_FILE}"
    }
    trap write_empty_results ERR

    IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    ARTIFACT_TYPE="application/vnd.in-toto+json"

    # Build the in-toto statement
    STATEMENT_FILE=$(mktemp)
    jq -n \
      --arg type "https://in-toto.io/Statement/v0.1" \
      --arg predicate_type "${PREDICATE_TYPE}" \
      --arg image_url "${IMAGE_URL}" \
      --arg image_digest_hex "${IMAGE_DIGEST#sha256:}" \
      --arg result "$(echo "${TEST_OUTPUT}" | jq -r '.result // "UNKNOWN"')" \
      --arg timestamp "${TIMESTAMP}" \
      --arg test_name "${TEST_NAME}" \
      --argjson successes "$(echo "${TEST_OUTPUT}" | jq '.successes // 0')" \
      --argjson failures "$(echo "${TEST_OUTPUT}" | jq '.failures // 0')" \
      --argjson warnings "$(echo "${TEST_OUTPUT}" | jq '.warnings // 0')" \
      --argjson test_output "${TEST_OUTPUT}" \
      '{
        "_type": $type,
        "predicateType": $predicate_type,
        "subject": [
          {
            "name": $image_url,
            "digest": {
              "sha256": $image_digest_hex
            }
          }
        ],
        "predicate": {
          "result": $result,
          "timestamp": $timestamp,
          "configuration": [{name: $test_name}],
          "successes": $successes,
          "failures": $failures,
          "warnings": $warnings,
          "output": $test_output
        }
      }' > "${STATEMENT_FILE}"

    echo "=== Creating Test Result Attestation ==="
    echo "Image:          ${IMAGE_REF}"
    echo "Test:           ${TEST_NAME}"
    echo "Predicate Type: ${PREDICATE_TYPE}"
    echo ""
    echo "Statement:"
    jq '.' "${STATEMENT_FILE}"
    echo ""

    ORAS_ARGS=()
    if [ -n "${REGISTRY_CONFIG}" ] && [ -f "${REGISTRY_CONFIG}" ]; then
      echo "Using registry config: ${REGISTRY_CONFIG}"
      ORAS_ARGS+=(--registry-config "${REGISTRY_CONFIG}")
    fi

    # Attach the attestation as an OCI referrer using oras
    echo "=== Attaching Attestation ==="
    if ! oras attach \
      "${ORAS_ARGS[@]}" \
      --artifact-type "${ARTIFACT_TYPE}" \
      --annotation "predicateType=${PREDICATE_TYPE}" \
      --annotation "testName=${TEST_NAME}" \
      --annotation "org.opencontainers.image.created=${TIMESTAMP}" \
      --disable-path-validation \
      "${IMAGE_REF}" \
      "${STATEMENT_FILE}:application/json"; then
      echo "ERROR: oras attach failed"
      exit 1
    fi

    echo ""

    # Discover the attestation digest
    echo "=== Discovering Attestation Digest ==="

    ATTESTATION_DIGEST=$(oras discover "${ORAS_ARGS[@]}" "${IMAGE_REF}" \
      --artifact-type "${ARTIFACT_TYPE}" \
      --format json 2>/dev/null \
      | jq -r '.manifests[0].digest // empty' || true)

    if [ -z "${ATTESTATION_DIGEST}" ]; then
      echo "ERROR: Could not discover attestation digest from registry"
      write_empty_results
      exit 1
    fi

    echo "Attestation URL:    ${IMAGE_URL}"
    echo "Attestation Digest: ${ATTESTATION_DIGEST}"

    # Write the single JSON result
    jq -n \
      --arg uri "${IMAGE_URL}" \
      --arg digest "${ATTESTATION_DIGEST}" \
      '{"uri": $uri, "digest": $digest}' > "${RESULT_FILE}"

    echo ""
    echo "=== Attestation Complete ==="
    rm -f "${STATEMENT_FILE}"
